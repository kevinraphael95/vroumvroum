<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Debug Examen - VroumVroum</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/pages.css?v=4">
<script>try{if(localStorage.getItem("vroum-theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<style>
  .debug-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; font-family: 'Inter', sans-serif; }
  .debug-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; color: var(--text-main, #0f172a); }
  .debug-card { background: var(--bg-card, #ffffff); border: 1px solid var(--border, #e2e8f0); border-radius: 12px; padding: 20px; margin-bottom: 20px; display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: start; color: var(--text-main, #0f172a); }
  .debug-card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; }
  .debug-info h3 { margin: 0 0 8px 0; font-size: 16px; color: var(--text-main, #0f172a); }
  .debug-meta { display: flex; gap: 10px; font-size: 12px; margin-bottom: 10px; color: var(--text-muted, #64748b); }
  .debug-badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
  .debug-options, .debug-reponses { font-size: 14px; margin-top: 6px; }
  .debug-options ul { margin: 4px 0 0 16px; padding: 0; }
  .debug-correct { color: #16a34a; font-weight: 700; }
  .debug-expl { margin-top: 8px; font-size: 13px; color: var(--text-muted, #64748b); font-style: italic; }
  @media(max-width: 768px) { .debug-card { grid-template-columns: 1fr; } .debug-card img { height: 180px; } }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><div class="logo-mark">V</div>VroumVroum</a>
    <div class="nav-right">
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="fiches.html">Fiches</a></li>
        <li><a href="qcm.html">QCM</a></li>
        <li><a href="examen.html">Examen</a></li>
      </ul>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de thème"></button>
    </div>
  </div>
</nav>

<div class="debug-container">
  <div class="debug-header">
    <h1>🛠️ Outil de Debug - Questions Chargées</h1>
    <span id="debug-counter" class="debug-badge" style="font-size: 16px; padding: 6px 12px;">Chargement...</span>
  </div>
  <div id="debug-list"></div>
</div>

<footer>© 2026 VroumVroum — Fiches de révision du Code de la route</footer>

<script src="js/core.js"></script>
<script src="js/data-fiches.js"></script>
<!-- On intercepte window.initExamen pour afficher le contenu brut à la place du module d'examen -->
<script>
  window.initExamen = function() {
    const questions = window.EXAMEN_QUESTIONS || [];
    document.getElementById('debug-counter').textContent = `${questions.length} questions chargées`;
    const container = document.getElementById('debug-list');
    container.innerHTML = '';

    questions.forEach((q, index) => {
      let optionsHtml = '';
      if (q.type === 'oui-non' && q.affirmations) {
        optionsHtml = '<ul>' + q.affirmations.map((aff, i) => `<li>Affirmation ${i+1}: "${aff.texte}" — <strong>${aff.vrai ? 'OUI (Vrai)' : 'NON (Faux)'}</strong></li>`).join('') + '</ul>';
      } else if (q.reponses) {
        // Mode QCM standard issu de la traduction brute ou objets reponses
        optionsHtml = '<ul>' + Object.entries(q.reponses).map(([k, v]) => `<li><b>${v.texte}</b> — Correcte: <span class="${v.correcte ? 'debug-correct' : ''}">${v.correcte ? 'OUI' : 'NON'}</span></li>`).join('') + '</ul>';
      }

      const card = document.createElement('div');
      card.className = 'debug-card';
      card.innerHTML = `
        <div>
          <img src="${q.image}" alt="${q.alt || 'Image question'}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100%\' height=\'100%\' fill=\'%23f1f5f9\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2394a3b8\' font-size=\'12\'>Pas d\'image</text></svg>'">
        </div>
        <div class="debug-info">
          <div class="debug-meta">
            <span class="debug-badge">#${q.id}</span>
            <span><b>Thème :</b> ${q.theme || 'N/A'}</span>
            <span><b>Fiche :</b> ${q.fiche || 'N/A'}</span>
          </div>
          <h3>${q.question || q.alt}</h3>
          <div class="debug-options"><b>Options / Évaluations :</b> ${optionsHtml}</div>
          <div class="debug-expl"><b>Explication :</b> ${q.explication || 'Aucune explication'}</div>
        </div>
      `;
      container.appendChild(card);
    });
  };
</script>
<script src="js/import-github.js"></script>
</body>
</html>
