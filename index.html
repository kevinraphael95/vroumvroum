<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>VroumVroum – Examen blanc du Code de la route</title>
<meta name="description" content="Examen blanc du Code de la route avec images, comme l'examen réel.">
<script>try{if(localStorage.getItem("vroum-theme")==="dark")document.documentElement.classList.add("dark")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <span class="logo"><b>V</b>VroumVroum</span>
  <button type="button" id="theme" aria-label="Changer de thème"></button>
</header>

<!-- ACCUEIL -->
<main id="intro" class="page">
  <h1>Examen blanc</h1>
  <p class="soft">Un test avec images, présenté comme l'examen réel.</p>
  <ul id="rules" class="rules"></ul>
  <p id="best" class="best"></p>
  <p id="warn" class="warn" hidden></p>
  <button type="button" id="start" class="btn" disabled>Chargement…</button>
  <p class="soft small">Clavier : <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> pour répondre, <kbd>Entrée</kbd> pour valider.</p>
</main>

<!-- QUESTION -->
<section id="quiz" class="quiz" hidden>
  <div id="figure" class="figure"></div>
  <div class="panel">
    <div class="panel-main">
      <p id="question" class="q"></p>
      <div id="answers"></div>
    </div>
    <div class="side">
      <span id="mode" class="mode"></span>
      <div id="ring" class="ring">
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="44" r="30" class="ring-bg"></circle>
          <circle id="ring-fg" cx="40" cy="44" r="30" class="ring-fg" transform="rotate(-90 40 44)"></circle>
        </svg>
        <span id="secs" class="sr">30</span>
      </div>
    </div>
    <div class="bar">
      <span>Question <strong id="num">01</strong><span id="total"></span></span>
      <span class="bar-btns">
        <button type="button" id="quit" class="btn-s">Quitter</button>
        <button type="button" id="next" class="btn-s main">Valider</button>
      </span>
    </div>
  </div>
</section>

<!-- RÉSULTAT -->
<main id="result" class="page wide" hidden>
  <div class="res-head">
    <div>
      <h2>Examen terminé</h2>
      <p id="verdict" class="soft"></p>
    </div>
    <div id="score" class="score"></div>
  </div>
  <div class="res-body">
    <div><h3>Réponses</h3><div id="grid" class="grid"></div></div>
    <div><h3>Détail</h3><div id="detail" class="detail"></div></div>
    <div><h3>Par thème</h3><div id="themes"></div></div>
  </div>
  <button type="button" id="replay" class="btn">Rejouer →</button>
</main>

<script src="exam.js"></script>
</body>
</html>
