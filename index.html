<!DOCTYPE html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{if(localStorage.getItem("vroum-theme")==="dark"){var d=document.documentElement;d.classList.add("dark");d.style.colorScheme="dark";d.style.backgroundColor="#0d1220"}}catch(e){}</script>
<meta name="theme-color" content="#2563eb">
<title>VroumVroum</title>
<meta name="description" content="VroumVroum - Fiches de révision et quiz d'entraînement pour réussir ton Code de la route. Préparation ETG 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><div class="logo-mark">V</div>VroumVroum</a>
    <div class="nav-right">
      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="active">Accueil</a></li>
        <li><a href="fiches.html">Fiches</a></li>
        <li><a href="examen.html">Examen</a></li>
      </ul>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de thème"></button>
      <button class="nav-burger" id="nav-burger" onclick="toggleMenu()"
              aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="container">

  <div class="dashboard-header">
    <div class="greeting">
      <h1>Bonjour, prêt à réviser ton <em>code</em> ?</h1>
      <p id="dash-msg">Chargement…</p>
    </div>
    <div class="progress-ring">
      <svg width="130" height="130" aria-hidden="true">
        <circle class="bg" cx="65" cy="65" r="54"></circle>
        <circle class="fg" id="ring-fg" cx="65" cy="65" r="54" style="stroke-dashoffset:339"></circle>
      </svg>
      <span class="label" id="dash-pct">0%</span>
      <span class="sub">Progression</span>
    </div>
  </div>

  <div class="stats-grid">
    <a href="fiches.html" class="stat-card">
      <div class="stat-icon book">📚</div>
      <div>
        <div class="stat-value" id="stat-fiches">0 / 0</div>
        <div class="stat-label">Fiches terminées</div>
      </div>
    </a>
    <a href="examen.html" class="stat-card">
      <div class="stat-icon examen">🖼️</div>
      <div>
        <div class="stat-value" id="stat-examen-img">—</div>
        <div class="stat-label">Meilleur examen avec images</div>
      </div>
    </a>
  </div>

  <div class="section-head">
    <div>
      <h2>Mes parcours</h2>
      <p>Continue là où tu t'es arrêté</p>
    </div>
    <a href="fiches.html" class="section-link">Tout voir →</a>
  </div>

  <div class="modules-grid" id="modules-grid"></div>

</div>

<footer>© 2026 VroumVroum — Fiches de révision du Code de la route</footer>

<script src="js/core.js"></script>
<script src="js/fiches-data.js"></script>
<script src="js/accueil.js"></script>

</html>
