<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermisDrive — Test QCM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🚗 PermisDrive</h1>
        <p>Entraînement interactif au Code de la route</p>
    </header>

    <nav>
        <a href="index.html" class="nav-btn">📚 Fiches de Cours</a>
        <a href="qcm.html" class="nav-btn active">📝 Entraînement QCM</a>
    </nav>

    <section>
        <h2>📝 QCM d'Entraînement</h2>
        <div id="quiz-box">
            <div id="question-text" class="question">Chargement...</div>
            <div id="options-container" class="options"></div>
            <div id="feedback-text" class="feedback"></div>
            <button id="next-btn" class="btn-action" style="display: none;" onclick="nextQuestion()">Question suivante</button>
        </div>
        <div id="result-box" style="display: none; text-align: center;">
            <h3 id="score-text" style="margin-bottom: 16px;"></h3>
            <button class="btn-action" onclick="restartQuiz()">Recommencer un nouveau test</button>
        </div>
    </section>

    <footer>
        <p>PermisDrive — Modèle Open-Source de révision</p>
    </footer>
</div>

<script src="app.js"></script>
</body>
</html>
