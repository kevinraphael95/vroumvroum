<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PermisDrive — Test QCM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">PermisDrive.</div>
        <ul class="nav-links">
            <li><a href="index.html">Fiches de Cours</a></li>
            <li><a href="qcm.html" class="active">Entraînement QCM</a></li>
        </ul>
    </nav>

    <div class="container">
        <h2 class="section-title">Session d'Entraînement</h2>

        <div id="quiz-box" class="card">
            <div id="question-text" class="question-title">Chargement de la question...</div>
            <div id="options-container" class="options-grid"></div>
            <div id="feedback-text" class="feedback-card"></div>
            
            <div style="text-align: right; margin-top: 1.5rem;">
                <button id="next-btn" class="btn btn-dark" style="display: none;" onclick="nextQuestion()">Question suivante</button>
            </div>
        </div>

        <div id="result-box" class="card" style="display: none; text-align: center;">
            <h3 id="score-text" style="margin-bottom: 1.5rem; font-size: 1.8rem;"></h3>
            <button class="btn btn-dark" onclick="restartQuiz()">Recommencer un nouveau test</button>
        </div>
    </div>

    <footer>
        <p>© 2026 PermisDrive — Réviser le Code de la Route simplement.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
